<style>
/* Layout: a reading-room page — centered library banner, sticky catalogue search, a shelf of year spines over catalogue cards, three-tab bar fixed at the bottom */
:root {

  --spine-2: #DDD5C6;
  --accent: #0D6B6B;      /* 도서관 녹색 잉크 */

  --fs-sub: 14px;          /* 글자 크기는 세 단계만 */
  --fs-body: 16px;
  --fs-title: 20px;
  --spine-y: 16px;         /* 책장 연도 */
  --spine-n: 12px;         /* 책장 권수 */
  --tabbar-h: 56px;
}
/* 글씨 크기 2·3단계. 책장 연도·권수(--spine-y·--spine-n)도 같이 커짐 */
:root[data-fs="2"] { --fs-sub: 15px; --fs-body: 17px; --fs-title: 21px; --spine-y: 17px; --spine-n: 12px; }
:root[data-fs="3"] { --fs-sub: 16px; --fs-body: 18px; --fs-title: 22px; --spine-y: 18px; --spine-n: 13px; }
@media (prefers-color-scheme: dark) {

    --bg: #121517;

    --fold: #22272A;
    --text: #ECE7DE;

    --shelf: #4A4F52;

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;

  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.6;
  letter-spacing: -0.01em;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
body::before {

.fs-ctl button:last-child { border-radius: 0 8px 8px 0; }
.fs-ctl [data-fs="1"] { font-size: 13px; }
.fs-ctl [data-fs="2"] { font-size: 15px; }
.fs-ctl [data-fs="3"] { font-size: 18px; }

.top {

  background: var(--bg);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.search-box { position: relative; width: min(100%, 560px); margin: 0 auto; }
.search-box svg.i {
  position: absolute;
  top: 50%;
  left: 14px;
  width: 16px;
  height: 16px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.search {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 10px 44px 10px 38px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font-size: var(--fs-body);
  outline: none;
}
.search::placeholder { color: var(--muted); }
.search:focus { border-color: var(--accent); }
.search::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.clear {
  position: absolute;
  top: 50%;
  right: 1px;
  width: 44px;
  height: 44px;
  transform: translateY(-50%);
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--muted);
  font-size: var(--fs-body);
}

/* Screens */
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px));
}
.view { width: min(100%, 560px); margin: 0 auto; }
.section-title { margin: 24px 2px 8px; font-size: var(--fs-body); font-weight: 700; line-height: 1.4; }
.view > .section-title:first-child { margin-top: 4px; }
.result-line { margin: 0 2px 12px; color: var(--muted); font-size: var(--fs-sub); }

/* Year shelf — 책등 위쪽에 연도, 아래쪽 실선 아래에 권수 숫자 */
.shelf {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  margin: 0 0 16px;
  padding: 8px 4px 0;
  border-bottom: 6px solid var(--shelf);
  border-radius: 0 0 3px 3px;
  box-shadow: 0 8px 8px -7px var(--shadow);
}
.spine {
  position: relative;
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;   /* 도서관 청구기호 라벨처럼 글씨는 아래쪽에 가지런히 */
  gap: 9px;
  min-width: 0;
  container-type: inline-size;   /* 책등 폭에 맞춰 연도 글씨 크기를 잡기 위해 */
  height: calc(88px + var(--h) * 30px);
  padding: 0 0 7px;
  border: 1px solid var(--shelf);
  border-bottom: 0;
  border-radius: 4px 4px 0 0;
  background: var(--spine);
  color: var(--text);
  transition: transform .2s ease, background-color .2s ease, color .2s ease;
}
.spine:nth-child(even) { background: var(--spine-2); }
.spine::before,
.spine::after {
  content: "";
  position: absolute;
  left: 4px;
  right: 4px;
  height: 0;
  border-top: 1px solid var(--shelf);

.spine::before { top: 6px; }
.spine::after { bottom: 23px; }
.spine-y {             /* 실제 책등처럼 글씨를 눕혀 위에서 아래로. 크기는 글씨 크기 단계를 따름 */
  font-size: var(--spine-y);
  font-size: min(var(--spine-y), calc(100cqw - 7px));   /* 책등이 아주 좁은 화면에서만 조금 줄임 */
  font-weight: 600;

  writing-mode: vertical-rl;

.spine-n {
  display: block;

.spine[aria-selected="true"]::after { border-color: currentColor; opacity: .5; }

/* Catalogue cards */
.card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
}
.list > :first-child { border-top: 0; }
.book { border-top: 1px solid var(--line); scroll-margin-top: calc(80px + env(safe-area-inset-top, 0px)); }
.book > summary,
.book > .row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 14px;
  gap: 10px 14px;
  align-items: center;
  padding: 16px 14px;
  background: var(--fold);
  list-style: none;
  cursor: pointer;
  transition: background-color .6s ease;
  -webkit-tap-highlight-color: transparent;
}
.book.up > summary,
.book.up > .row { grid-template-columns: 16px minmax(0, 1fr) 14px; }
.book.has-cover > summary,
.book.has-cover > .row { grid-template-columns: 40px minmax(0, 1fr) 14px; }
.book.up.has-cover > summary,
.book.up.has-cover > .row { grid-template-columns: 16px 40px minmax(0, 1fr) 14px; column-gap: 12px; }
.book-cover {
  display: block;
  width: 40px;
  height: 58px;
  border-radius: 3px;
  background: var(--card);
  object-fit: contain;
  box-shadow: 0 1px 3px var(--shadow);

.book > .row { cursor: default; }
.book > summary::-webkit-details-marker { display: none; }
.book > summary::marker { content: ""; }
.book > summary::after {
  content: "";
  grid-row: 1;
  grid-column: -2 / -1;
  justify-self: center;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: translateY(-2px) rotate(45deg);
  transition: transform .16s ease;
}
.book[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.book[open] > summary { box-shadow: inset 0 -1px 0 var(--line); }
.book.flash > summary,
.book.flash > .row { background: var(--accent-soft); transition: none; }
/* 읽은 책 줄: [표지][제목 / 작가][날짜 / 펼침 표시].
   날짜(3.15.금)는 오른쪽 위, 제목 줄과 가운데를 맞춘 작은 회색 글씨 */
.book:not(.up) > summary { grid-template-rows: 1fr auto auto 1fr; row-gap: 0; }
.book:not(.up).has-cover > summary { grid-template-columns: 40px minmax(0, 1fr) auto; }

.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.book:not([open]) > .body { display: none; }
.body { display: grid; gap: 10px; padding: 14px 14px 18px; }
.facts { display: grid; gap: 2px; margin: 0; }
.facts > div { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; }
.person { gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }   /* 작가 */
.pn { font-weight: 700; }
.py { margin-left: 6px; color: var(--muted); font-size: var(--fs-sub); font-variant-numeric: tabular-nums; }
.pb { display: block; margin-top: 2px; }
.w { display: inline-block; max-width: 100%; margin-right: 6px; }
.facts dt { color: var(--muted); font-size: var(--fs-sub); line-height: 1.85; }
.facts dd { margin: 0; min-width: 0; }
.desc { margin: 0; }
.see { display: flex; align-items: baseline; gap: 10px; margin: 0; font-size: var(--fs-sub); line-height: 1.5; }
.see-label { flex: 0 0 auto; color: var(--muted); }
.see-links { display: flex; flex-wrap: wrap; gap: 2px 12px; min-width: 0; }
.jump {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: var(--fs-sub);
  line-height: 1.5;
  text-align: left;
}
/* 다음 책: 책갈피를 꽂아 둔 카드 */
.next {
  position: relative;
  display: grid;
  gap: 8px;
  margin: 0 0 14px;
  padding: 18px 16px 12px;
  border: 1px solid var(--accent-line);
  border-radius: 14px;
  background: var(--accent-soft);
  scroll-margin-top: calc(80px + env(safe-area-inset-top, 0px));
}
.next::before {
  content: "";
  position: absolute;
  top: -1px;
  right: 20px;
  width: 14px;
  height: 28px;
  background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%);
}
.next.flash { box-shadow: 0 0 0 2px var(--accent); }
.next.has-cover { min-height: 106px; padding-left: 86px; }
.next-cover {
  position: absolute;
  top: 18px;
  left: 16px;
  display: block;
  width: 54px;
  height: 78px;
  border-radius: 4px;
  background: var(--card);
  object-fit: contain;
  box-shadow: 0 1px 4px var(--shadow);
}
.next-label { margin: 0; color: var(--accent); font-size: var(--fs-sub); font-weight: 700; }
.next-t { margin: -4px 0 0; padding-right: 32px; font-size: var(--fs-title); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.next-meta { margin: -4px 0 0; color: var(--muted); font-size: var(--fs-sub); }
.next-desc { margin: 2px 0 0; }
.next-au { margin: 2px 0 0; padding-top: 10px; border-top: 1px solid var(--accent-line); color: var(--muted); font-size: var(--fs-sub); line-height: 1.6; }
.next-au .pn { color: var(--text); }
#todo-list > .is-next { display: none; }          /* 1번은 카드로 보여 주고 목록에서는 숨김(검색용) */
#todo-list > .is-next + .book { border-top: 0; }
.store { margin: 0; font-size: var(--fs-sub); line-height: 1.5; }
.store a {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding-block: 4px;
  color: var(--accent);
  font-weight: 700;
  text-decoration: none;
}
.store a:hover { text-decoration: underline; }
.store svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.empty { margin: 0; padding: 24px 16px; color: var(--muted); font-size: var(--fs-sub); text-align: center; }

/* Stats */
.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 4px 0 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
}
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 12px 14px; }
.tile + .tile { border-left: 1px solid var(--line); }
.tile-n { font-size: var(--fs-title); font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.tile-n small { margin-left: 2px; color: var(--muted); font-size: var(--fs-sub); font-weight: 700; }
.tile-l { color: var(--muted); font-size: var(--fs-sub); }
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
}
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sub); font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.5; }
thead th { border-top: 0; background: var(--fold); color: var(--muted); font-weight: 700; }
tbody th { color: var(--text); font-weight: 700; white-space: nowrap; }
.num { text-align: right; white-space: nowrap; }
.t-year th, .t-year td { vertical-align: middle; }
.t-year tbody th { width: 60px; }
.barrow { display: flex; align-items: center; gap: 10px; }
.track { flex: 1 1 auto; min-width: 0; }
.bar { display: block; min-width: 3px; height: 8px; border-radius: 2px; background: var(--accent); }
.barrow .v { flex: 0 0 22px; font-weight: 700; text-align: right; }
.t-author tbody th { width: 1%; }
.who {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: var(--fs-sub);
  font-weight: 700;
  text-align: left;
  white-space: nowrap;
}
.titles .bt { display: block; }
.titles .bt + .bt { margin-top: 2px; }
.yr { color: var(--muted); }

/* Tab bar */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  width: min(100%, 560px);
  margin: 0 auto;
}
.tab {
  display: flex;
  min-height: var(--tabbar-h);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 4px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: var(--fs-sub);
  font-weight: 700;
}
.tab[aria-selected="true"] { color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
.data-error { margin: 0 auto 16px; padding: 14px 16px; width: min(100%, 560px); border: 1px solid var(--accent-line); border-radius: 12px; background: var(--accent-soft); }
</style>
</head>
<body>


<header class="banner">
  <div class="banner-in">
    <div class="fs-ctl" role="group" aria-label="글씨 크기">
      <button type="button" data-fs="1" aria-label="글씨 1단계" aria-pressed="true">가</button>
      <button type="button" data-fs="2" aria-label="글씨 2단계" aria-pressed="false">가</button>
      <button type="button" data-fs="3" aria-label="글씨 3단계" aria-pressed="false">가</button>
    </div>
    <h1 class="banner-title">공부하는 주부들</h1>
  </div>
</header>

<div class="top">
  <div class="search-box">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input class="search" id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="책 제목·저자·연도로 찾기" aria-label="책 제목, 저자, 연도로 찾기">
    <button class="clear" id="clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
  </div>
</div>

<main class="wrap">
  <p class="data-error" id="data-error" hidden>책 데이터를 읽지 못했습니다. 파일 맨 위 ‘책 데이터’ 칸에 빠진 쉼표나 따옴표가 없는지 확인해 주세요.</p>
  <section class="view" id="view-todo" aria-label="읽을 책">
    <div id="next-slot"></div>
    <div class="card list" id="todo-list">
    </div>
  </section>

  <section class="view" id="view-list" aria-label="읽은 책" hidden>
    <nav class="shelf" id="shelf" role="tablist" aria-label="연도"></nav>
    <div id="year-panels"></div>
  </section>

  <section class="view" id="view-stats" aria-label="통계" hidden>
    <div class="tiles" id="tiles"></div>
    <h2 class="section-title">연도별 권수</h2>
    <div class="table-wrap">
      <table class="t-year">
        <thead><tr><th scope="col">연도</th><th scope="col">권수</th></tr></thead>
        <tbody id="year-rows"></tbody>
      </table>
    </div>
    <h2 class="section-title">두 권 이상 읽은 저자</h2>
    <div class="table-wrap">
      <table class="t-author">
        <thead><tr><th scope="col">저자</th><th scope="col" class="num">권</th><th scope="col">책</th></tr></thead>
        <tbody id="author-rows"></tbody>
      </table>
    </div>
  </section>

  <section class="view" id="view-search" aria-label="검색 결과" hidden>
    <p class="result-line" id="search-desc" aria-live="polite"></p>
    <div class="card list" id="search-list"></div>
    <h2 class="section-title" id="search-todo-title" hidden>읽을 책</h2>
    <div class="card list" id="search-todo" hidden></div>
  </section>
</main>

<nav class="tabbar" aria-label="화면 메뉴">
  <div class="tabbar-inner" role="tablist">
    <button class="tab" type="button" role="tab" data-view="todo" aria-controls="view-todo" aria-selected="true">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>
      <span>읽을 책</span>
    </button>
    <button class="tab" type="button" role="tab" data-view="list" aria-controls="view-list" aria-selected="false">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10.2 5.3 7.6 4.7 4 4.9v13c3.6-.2 6.2.4 8 1.7 1.8-1.3 4.4-1.9 8-1.7v-13c-3.6-.2-6.2.4-8 1.7z"/><path d="M12 6.6v13"/></svg>
      <span>읽은 책</span>
    </button>
    <button class="tab" type="button" role="tab" data-view="stats" aria-controls="view-stats" aria-selected="false">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-11"/></svg>
      <span>통계</span>
    </button>
  </div>
</nav>

<script>
/* 화면 그리기 — 맨 위 책 데이터(UPCOMING·READ·BOOKS·AUTHORS)로 목록, 책등, 통계, ‘다음 책’ 카드를 만듭니다.
   데이터만 고치면 되고, 이 부분은 고치지 않습니다. */
(() => {
  const err = document.getElementById('data-error');
  if (typeof READ === 'undefined' || typeof UPCOMING === 'undefined'
      || typeof BOOKS === 'undefined' || typeof AUTHORS === 'undefined') {
    err.hidden = false;
    return;
  }
  try { render(); } catch (e) { console.error(e); err.hidden = false; }

  function render() {
    const WD = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    const ALIAS = { '요한 볼프강 폰 괴테': '괴테', '류시화 엮음': '류시화' };
    const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
    const str = (s) => String(s == null ? '' : s).trim();
    const pad = (n) => String(n).padStart(2, '0');
    // ‘미술 이야기 2’처럼 끝의 짧은 낱말이 혼자 줄바꿈되지 않게 붙임.
    // 붙인 덩어리가 길면 칸보다 넓어져 낱말 중간에서 끊기므로, 다섯 글자 이하일 때만 붙임.
    // ‘슈만·브람스’의 가운뎃점 앞뒤에서도 줄이 바뀌지 않게 함
    const nb = (s) => {
      const t = s.replace(/·/g, '\u2060·\u2060');
      const i = t.lastIndexOf(' ');
      if (i < 0 || t.length - i - 1 > 2) return t;
      return t.length - t.lastIndexOf(' ', i - 1) - 1 <= 5 ? t.slice(0, i) + '\u00a0' + t.slice(i + 1) : t;
    };
    const cmp = (p, q) => (p < q ? -1 : p > q ? 1 : 0);
    // 제목·작가 이름은 띄어쓰기가 조금 달라도 찾아지게 함
    const key = (s) => str(s).replace(/\s+/g, '');
    const index = (o) => { const m = new Map(); Object.keys(o).forEach((k) => m.set(key(k), k)); return m; };
    const bookKey = index(BOOKS), authorKey = index(AUTHORS);
    // 표지 그림은 assets/covers/번호.jpg. 파일이 있는 번호만 적음 (b001~b074는 뮤즈 원본, 나머지는 교보문고)
    const COVER_IDS = new Set('b001 b002 b003 b004 b005 b006 b007 b008 b009 b010 b011 b012 b013 b014 b015 b016 b017 b018 b019 b020 b021 b022 b023 b024 b025 b026 b027 b028 b029 b031 b032 b033 b034 b035 b036 b037 b038 b039 b040 b041 b042 b043 b044 b045 b046 b047 b048 b049 b050 b051 b052 b053 b054 b055 b056 b057 b058 b059 b060 b061 b062 b063 b064 b065 b066 b067 b068 b069 b070 b071 b072 b073 b074 b075 b076 b077 b078 b079 b080 b081 b082 b083 b084 b085 b086 b087 b088 b089 b090 b091 b092 b093 b094 b095 b096 b097 b098 b099 b100 b101 b102 b103 b104 b105 b106 b107 b108 b109 b110 b111 b112 b113 b114 b115 b116 b117 b118 b119 b120 b121 b122 b123 b124 b125 b126 b127 b128 b129 b130 b131 t01 t02 t03 t04 t05 t06 t07'.split(' '));

    function prep(title, up) {
      const k = bookKey.get(key(title));
      const b = k ? BOOKS[k] : {};
      if (!k) console.warn('BOOKS에 정보가 없는 책:', title);
      const x = {
        t: k || str(title), a: str(b.author), genre: str(b.genre), pub: str(b.published),
        orig: str(b.original), award: str(b.award), desc: str(b.about), up,
      };
      x.au = ALIAS[x.a] || x.a;
      const ak = x.au && authorKey.get(key(x.au));
      const p = b.person || (ak && Object.assign({ name: ak }, AUTHORS[ak]));
      x.person = p && p.name ? Object.assign({ label: '작가' }, p) : null;
      return x;
    }

    const read = [];
    READ.forEach((r, k) => {
      const [date, title] = Array.isArray(r) ? r : [];
      const x = prep(title, false);
      const m = str(date).replace(/[./]/g, '-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!str(title) || !m) { console.warn('날짜(YYYY-MM-DD)나 제목이 없어 건너뛴 줄:', r); return; }
      const y = +m[1], mo = +m[2], d = +m[3];
      Object.assign(x, {
        key: `${y}-${pad(mo)}-${pad(d)}`, order: k, year: y, mo,
        ym: `${y}.${pad(mo)}`, dd: pad(d), wd: WD[new Date(y, mo - 1, d).getDay()], label: `${y}.${mo}.${d}`,
      });
      x.sr = `${y}년 ${mo}월 ${d}일 ${x.wd}`;
      read.push(x);
    });
    read.sort((p, q) => cmp(p.key, q.key) || p.order - q.order);
    read.forEach((x, i) => { x.id = 'b' + String(i + 1).padStart(3, '0'); });
    const up = UPCOMING.filter((t) => str(t)).map((t) => prep(t, true));
    up.forEach((x, i) => { Object.assign(x, { id: 'u' + (i + 1), n: i + 1, year: 0, label: '' }); });

    // 함께 보기: 같은 작가의 다른 책
    const all = read.concat(up);
    all.forEach((b) => {
      const seen = new Set([b.t]);
      b.see = [];
      if (!b.au) return;
      all.forEach((x) => {
        if (x.au === b.au && !seen.has(x.t)) { seen.add(x.t); b.see.push([x.id, x.t + (x.up ? ' (읽을 책)' : '')]); }
      });
    });

    const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
    const store = (b) => {
      const kw = [b.t.replace(/:/g, ' '), b.au].filter(Boolean).join(' ');
      const url = 'https://search.kyobobook.co.kr/search?keyword=' + encodeURIComponent(kw) + '&gbCode=TOT&target=total';
      return `<p class="store"><a href="${esc(url)}" target="_blank" rel="noopener">교보문고에서 보기${ARROW}</a></p>`;
    };
    const years = (p) => (p.years ? `<span class="py">${esc(p.years)}</span>` : '');
    function personDl(p) {
      let rows = `<div><dt>${esc(p.label)}</dt><dd><b class="pn">${esc(p.name)}</b>${years(p)}<span class="pb">${esc(p.bio)}</span></dd></div>`;
      if (p.works) {  // 제목 하나가 줄 중간에서 갈라지지 않게 제목마다 묶음
        const ws = String(p.works).match(/[『「][^』」]*[』」]/g) || [p.works];
        rows += `<div><dt>대표작</dt><dd>${ws.map((w) => `<span class="w">${esc(w)}</span>`).join('')}</dd></div>`;
      }
      return `<dl class="facts person">${rows}</dl>`;
    }

    function coverId(b) {
      if (b.up) return 't' + pad(b.n);
      const n = Number(b.id.slice(1));
      return 'b' + String(n >= 30 ? n + 1 : n).padStart(3, '0');
    }
    function coverImg(b, cls) {
      const id = coverId(b);
      return COVER_IDS.has(id)
        ? `<img class="${cls}" src="assets/covers/${id}.jpg" alt="" loading="lazy" decoding="async">`
        : '';
    }

    function row(b, rowId, extra) {
      const hay = [b.t, b.a, b.genre, b.desc, b.orig, b.award, b.person ? b.person.name : '',
        b.year || '', b.label, b.up ? '읽을 책' : ''].filter(Boolean).join(' ');
      const date = b.up
        ? `<span class="idx" aria-hidden="true">${b.n}</span>`
        : `<span class="rd" aria-hidden="true">${b.mo}.${Number(b.dd)}.${b.wd.slice(0, 1)}</span>`;
      const head = `<div class="head"><h3 class="t">${esc(nb(b.t))}</h3>`
        + (b.a ? `<p class="a">${esc(b.a)}</p>` : '') + (b.up ? '' : `<span class="sr">${esc(b.sr)}</span>`) + '</div>';
      const facts = [['장르', b.genre], ['출간', b.pub], ['원제', b.orig], ['수상', b.award]].filter((f) => f[1]);
      let body = '';
      if (facts.length) body += '<dl class="facts">' + facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('') + '</dl>';
      if (b.desc) body += `<p class="desc">${esc(b.desc)}</p>`;
      if (b.person) body += personDl(b.person);
      if (b.see.length) {
        body += '<p class="see"><span class="see-label">함께 보기</span><span class="see-links">'
          + b.see.map(([i, t]) => `<button type="button" class="jump" data-jump="${i}">${esc(t)}</button>`).join('') + '</span></p>';
      }
      body += store(b);
      const cover = coverImg(b, 'book-cover');
      const cls = (b.up ? 'book up' : 'book') + (cover ? ' has-cover' : '') + (extra || '');
      return `<details class="${cls}" id="${rowId || b.id}" data-h="${esc(hay)}"><summary>${b.up ? date : ''}${cover}${head}${b.up ? '' : date}</summary><div class="body">${body}</div></details>`;
    }

    // 읽을 책: 1번은 맨 위 ‘다음 책’ 카드, 목록의 같은 줄은 검색용으로만 남김
    if (up.length) {
      const u = up[0], p = u.person;
      const meta = [u.a, u.genre, u.award || u.pub].filter(Boolean).join(' · ');
      const cover = coverImg(u, 'next-cover');
      document.getElementById('next-slot').innerHTML =
        `<article class="next${cover ? ' has-cover' : ''}" id="${u.id}" aria-labelledby="next-t">${cover}<p class="next-label">다음 책 · 11월 6일 (금)</p>`
        + `<h2 class="next-t" id="next-t">${esc(nb(u.t))}</h2><p class="next-meta">${esc(meta)}</p>`
        + (u.desc ? `<p class="next-desc">${esc(u.desc)}</p>` : '')
        + (p ? `<p class="next-au"><b class="pn">${esc(p.name)}</b>${years(p)}<span class="pb">${esc(p.bio)}</span></p>` : '')
        + store(u) + '</article>';
      document.getElementById('todo-list').innerHTML =
        up.map((x, i) => (i === 0 ? row(x, x.id + '-row', ' is-next') : row(x))).join('');
    } else {
      document.getElementById('todo-list').innerHTML = '<p class="empty">읽을 책을 추가해 주세요.</p>';
    }

    // 읽은 책: 연도 책등과 연도별 목록 (해마다 1월부터)
    const yearsList = [...new Set(read.map((b) => b.year))].sort((p, q) => p - q);
    const count = {};
    read.forEach((b) => { count[b.year] = (count[b.year] || 0) + 1; });
    const latest = yearsList[yearsList.length - 1];
    const maxC = Math.max(1, ...yearsList.map((y) => count[y]));
    document.getElementById('shelf').innerHTML = yearsList.map((y) =>
      `<button class="ytab spine" type="button" role="tab" data-year="${y}" aria-selected="${y === latest}" `
      + `aria-label="${y}년 ${count[y]}권" style="--h:${(count[y] / maxC).toFixed(2)}"><span class="spine-y">${y}</span>`
      + `<span class="spine-n">${count[y]}</span></button>`).join('');
    document.getElementById('year-panels').innerHTML = yearsList.map((y) =>
      `<section class="year-panel" data-year="${y}"${y === latest ? '' : ' hidden'}><div class="card list">`
      + read.filter((b) => b.year === y).map((b) => row(b)).join('') + '</div></section>').join('');

    // 통계
    document.getElementById('year-rows').innerHTML = yearsList.map((y) =>
      `<tr><th scope="row">${y}</th><td><div class="barrow"><span class="track"><span class="bar" style="width:${(count[y] / maxC * 100).toFixed(1)}%"></span></span>`
      + `<span class="v">${count[y]}</span></div></td></tr>`).join('');
    const byAuthor = new Map();
    read.forEach((b) => {
      if (!b.au) return;
      const l = byAuthor.get(b.au) || [];
      if (!l.some((x) => x.t === b.t)) l.push(b);
      byAuthor.set(b.au, l);
    });
    const multi = [...byAuthor.entries()].filter(([, l]) => l.length >= 2)
      .sort((p, q) => q[1].length - p[1].length || cmp(p[1][0].key, q[1][0].key));
    document.getElementById('author-rows').innerHTML = multi.map(([au, l]) =>
      `<tr><th scope="row"><button type="button" class="who" data-q="${esc(au)}">${esc(au)}</button></th><td class="num">${l.length}</td>`
      + `<td class="titles">${l.map((x) => `<span class="bt">${esc(x.t)} <span class="yr">${x.year}</span></span>`).join('')}</td></tr>`).join('');
    const first = read[0], last = read[read.length - 1];
    const tiles = [[read.length, '권', '함께 읽은 책'], [yearsList.length, '년', first ? `${first.year}–${last.year}` : ''],
      [byAuthor.size, '명', '만난 저자']];
    document.getElementById('tiles').innerHTML = tiles.map(([n, u, l]) =>
      `<div class="tile"><span class="tile-n">${n}<small>${u}</small></span><span class="tile-l">${esc(l)}</span></div>`).join('');
  }
})();
</script>
<script>
(() => {
  const q = document.getElementById('q');
  const clearBtn = document.getElementById('clear');
  const views = {
    todo: document.getElementById('view-todo'),
    list: document.getElementById('view-list'),
    stats: document.getElementById('view-stats'),
    search: document.getElementById('view-search'),
  };
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const ytabs = Array.from(document.querySelectorAll('.ytab'));
  const panels = Array.from(document.querySelectorAll('.year-panel'));
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const norm = (s) => (s || '').toLowerCase().replace(/[\s·・,.:;'"“”‘’<>()\[\]!?~\-–—_\/『』「」]/g, '');
  const books = Array.from(document.querySelectorAll('.year-panel .book'));
  const todos = Array.from(document.querySelectorAll('#todo-list .book'));
  books.concat(todos).forEach((el) => { el._h = norm(el.dataset.h); });

  let current = 'todo';   // 언제나 읽을 책부터
  const selected = ytabs.find((t) => t.getAttribute('aria-selected') === 'true');
  let year = selected ? selected.dataset.year : '';
  let searching = false;
  let savedY = 0;
  try {
    const y = localStorage.getItem('book.year');
    if (y && ytabs.some((t) => t.dataset.year === y)) year = y;
  } catch (e) { /* storage unavailable */ }

  // 글씨 크기: 1(본문 16px)·2(17px)·3(18px). 고른 크기는 이 기기에 기억
  const fsBtns = Array.from(document.querySelectorAll('.fs-ctl button'));
  function setFs(f, save) {
    if (f === '1') delete document.documentElement.dataset.fs;
    else document.documentElement.dataset.fs = f;
    fsBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.fs === f)));
    if (save) { try { localStorage.setItem('book.fs', f); } catch (e) { /* storage unavailable */ } }
  }
  setFs(document.documentElement.dataset.fs || '1', false);

  function show(name) {
    Object.keys(views).forEach((key) => { views[key].hidden = key !== name; });
  }
  function selectTab(name) {
    current = name;
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === name)));
  }
  function selectYear(y) {
    year = y;
    ytabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.year === y)));
    panels.forEach((p) => { p.hidden = p.dataset.year !== y; });
    try { localStorage.setItem('book.year', y); } catch (e) { /* storage unavailable */ }
  }
  function copyRow(el) {
    const c = el.cloneNode(true);
    c.open = false;
    c.classList.remove('flash');
    if (c.id) { c.dataset.ref = c.id; c.removeAttribute('id'); }
    return c;
  }
  function leaveSearch(restore) {
    if (!searching) return;
    searching = false;
    show(current);
    if (restore) window.scrollTo(0, savedY);
  }
  function runSearch() {
    const raw = q.value.trim();
    clearBtn.hidden = !q.value;
    const tokens = raw.split(/\s+/).map(norm).filter(Boolean);
    if (!tokens.length) { leaveSearch(true); return; }
    if (!searching) { savedY = window.scrollY; searching = true; }
    const hit = (el) => tokens.every((tk) => el._h.includes(tk));
    const found = books.filter(hit);
    const foundT = todos.filter(hit);
    const list = document.getElementById('search-list');
    if (found.length || !foundT.length) {
      list.hidden = false;
      if (found.length) {
        list.replaceChildren(...found.map(copyRow));
      } else {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = '찾는 책이 없음. 제목 일부나 저자 이름으로 다시 찾기.';
        list.replaceChildren(p);
      }
    } else {
      list.hidden = true;
      list.replaceChildren();
    }
    const tt = document.getElementById('search-todo-title');
    const tl = document.getElementById('search-todo');
    tl.replaceChildren(...foundT.map(copyRow));
    tt.hidden = !foundT.length;
    tl.hidden = !foundT.length;
    document.getElementById('search-desc').textContent =
      '‘' + raw + '’ 읽은 책 ' + found.length + '권' + (foundT.length ? ' · 읽을 책 ' + foundT.length + '권' : '');
    show('search');
    window.scrollTo(0, 0);
  }
  function jump(id) {
    const el = document.getElementById(id);
    if (!el) return;
    q.value = '';
    clearBtn.hidden = true;
    searching = false;
    const target = el.closest('#view-todo') ? 'todo' : 'list';
    selectTab(target);
    show(target);
    const panel = el.closest('.year-panel');
    if (panel) selectYear(panel.dataset.year);
    if ('open' in el) el.open = true;
    el.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    clearTimeout(el._flash);
    el._flash = setTimeout(() => el.classList.remove('flash'), 1600);
  }

  document.addEventListener('click', (e) => {
    const fb = e.target.closest('.fs-ctl button');
    if (fb) { setFs(fb.dataset.fs, true); return; }
    const j = e.target.closest('[data-jump]');
    if (j) { e.preventDefault(); jump(j.dataset.jump); return; }
    const who = e.target.closest('[data-q]');
    if (who) { q.value = who.dataset.q; runSearch(); return; }
    const yt = e.target.closest('.ytab');
    if (yt) { selectYear(yt.dataset.year); return; }
    const tab = e.target.closest('.tab');
    if (tab) {
      const name = tab.dataset.view;
      const wasSearching = searching;
      q.value = '';
      clearBtn.hidden = true;
      searching = false;
      if (name === current && !wasSearching) {
        window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
        return;
      }
      selectTab(name);
      show(name);
      window.scrollTo(0, 0);
    }
  });
  clearBtn.addEventListener('click', () => { q.value = ''; runSearch(); q.focus(); });
  q.addEventListener('input', runSearch);
  q.addEventListener('search', runSearch);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { q.value = ''; runSearch(); }
    if (e.key === 'Enter') q.blur();
  });

  selectYear(year);
  selectTab(current);
  show(current);
})();
</script>
